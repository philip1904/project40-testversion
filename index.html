<!doctype html>
<html lang="sv">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0b0c">

  <title>PROJECT 40 TEST 🧪</title>

  <style>

    html,
    body{
      margin:0;
      min-height:100%;
      background:#0b0b0c;
      color:#fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    #loader{
      min-height:100vh;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:14px;

      text-align:center;

      padding:24px;
    }

    .logo{
      width:82px;
      height:82px;

      border-radius:20px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#f5c518;
      color:#111;

      font-size:34px;
      font-weight:950;
    }

    h1{
      margin:0;

      font-size:24px;
      font-weight:950;
    }

    p{
      margin:0;

      color:#a6a6ab;

      font-size:14px;
      line-height:1.5;
    }

    .error{
      color:#ff7c7c;
    }

  </style>

</head>


<body>


<div id="loader">

  <div class="logo">
    40
  </div>

  <h1>
    PROJECT 40 TEST 🧪
  </h1>

  <p>
    Laddar den stabila basversionen…
  </p>

</div>


<script>

(async function(){

  const PROD_URL =
    "https://philip1904.github.io/project40/";

  const TEST_PATH =
    "/project40-testversion/";

  const TEST_URL =
    "https://philip1904.github.io/project40-testversion/";


  try{


    /*
      ========================================
      1. HÄMTA STABIL PRODUKTIONSVERSION
      ========================================
    */

    const response =
      await fetch(
        PROD_URL
        +
        "?testbase="
        +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Kunde inte hämta basversionen."
      );

    }


    let html =
      await response.text();


    /*
      ========================================
      2. TESTVERSIONENS SÖKVÄGAR
      ========================================

      /project40/
      blir
      /project40-testversion/

      Detta påverkar även APP_URL och
      service-worker-sökvägen.
    */

    html =
      html.replaceAll(
        "/project40/",
        TEST_PATH
      );


    /*
      ========================================
      3. EGEN SUPABASE-SESSION FÖR TEST
      ========================================

      Viktigt eftersom både produktion och
      test ligger på philip1904.github.io.

      Annars skulle browsern kunna dela
      samma Supabase-login mellan apparna.
    */

    html =
      html.replace(
        "detectSessionInUrl:false",
        `detectSessionInUrl:false,
        storageKey:"p40_test_auth_v1"`
      );


    /*
      ========================================
      4. EGNA LOCALSTORAGE-NYCKLAR
      ========================================

      Produktion:
      p40_...

      Test:
      p40test_...

      Då kan testversionen inte råka rensa
      eller använda produktionsappens lokala
      PROJECT 40-data.
    */

    html =
      html.replaceAll(
        "p40_",
        "p40test_"
      );


    /*
      ========================================
      5. TESTVERSIONEN SKA FUNKA DIREKT
         I EDGE/CHROME
      ========================================

      Vi bypassar installationskravet ENDAST
      i testversionen.

      Produktionen påverkas inte.
    */

    const standaloneStart =
      html.indexOf(
        "function isStandalone(){"
      );


    const iosStart =
      html.indexOf(
        "function isIOS(){",
        standaloneStart
      );


    if(
      standaloneStart !== -1
      &&
      iosStart !== -1
    ){

      html =
        html.slice(
          0,
          standaloneStart
        )
        +
        `function isStandalone(){

  return true;

}


`
        +
        html.slice(
          iosStart
        );

    }


    /*
      ========================================
      6. TESTMARKERING
      ========================================
    */

    html =
      html.replace(
        "<title>PROJECT 40 🦍</title>",
        "<title>PROJECT 40 TEST 🧪</title>"
      );


    const testBanner = `

<div
  id="p40TestBanner"
  style="
    position:fixed;
    z-index:99999;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#ff3b30;
    color:white;
    padding:5px 13px;
    border-radius:0 0 10px 10px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    font-size:10px;
    font-weight:950;
    letter-spacing:.7px;
    pointer-events:none;
  "
>
  🧪 TESTVERSION
</div>

`;


    html =
      html.replace(
        "<body>",
        "<body>"
        +
        testBanner
      );


    /*
      ========================================
      7. LADDA NYA MODES-FILEN
      ========================================

      Den ligger redan i testrepot:
      project40-modes.js
    */

    const modesScript = `

<script
  src="${TEST_PATH}project40-modes.js?v=${Date.now()}"
><\/script>

`;


    html =
      html.replace(
        "</body>",
        modesScript
        +
        "</body>"
      );


    /*
      ========================================
      8. TEST-SERVICE-WORKER SKA INTE
         RÖRA PRODUKTIONSAPPEN
      ========================================

      Det finns ingen anledning att testa
      PWA-cache ännu. Vi testar funktionerna.
    */

    html =
      html.replaceAll(
        `${TEST_PATH}service-worker.js`,
        `${TEST_PATH}service-worker-test-disabled.js`
      );


    /*
      ========================================
      9. SÄKERSTÄLL TEST-APP-URL
      ========================================
    */

    html =
      html.replaceAll(
        TEST_URL,
        TEST_URL
      );


    /*
      ========================================
      10. SKRIV UT HELA APPEN
      ========================================
    */

    document.open();

    document.write(
      html
    );

    document.close();


  }catch(error){


    console.error(
      "PROJECT 40 TEST loader:",
      error
    );


    document
      .getElementById(
        "loader"
      )
      .innerHTML = `

        <div class="logo">
          40
        </div>

        <h1>
          TESTVERSIONEN KUNDE INTE LADDAS
        </h1>

        <p class="error">
          ${String(
            error.message
            ||
            error
          )}
        </p>

      `;


  }


})();

</script>


</body>

</html>
